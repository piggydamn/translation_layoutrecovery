name: Build PDF Layout Corpus

on:
  push:
    branches:
      - pdf-corpus-layout-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Assemble builder
        run: |
          cat tools/pdf_layout_builder.part00 \
              tools/pdf_layout_builder.part01 \
              tools/pdf_layout_builder.part02 \
              tools/pdf_layout_builder.part03 \
              > tools/build_pdf_layout_corpus.py
          python -m py_compile tools/build_pdf_layout_corpus.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF requests beautifulsoup4 Pillow

      - name: Build and verify corpus
        run: |
          python tools/build_pdf_layout_corpus.py
          test "$(find out/pdf_layout_collection_50_v2 -type f -name '*.pdf' | wc -l)" -eq 50
          unzip -t out/pdf_layout_collection_50_v2.zip
          unzip -t out/pdf_layout_source_files_50_v2.zip
          sha256sum -c out/pdf_layout_collection_50_v2.sha256

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-layout-corpus-v2
          path: |
            out/pdf_layout_collection_50_v2.zip
            out/pdf_layout_source_files_50_v2.zip
            out/pdf_layout_collection_50_v2.sha256
            out/pdf_layout_collection_50_v2/manifest.csv
            out/pdf_layout_collection_50_v2/README_CN.md
            out/pdf_layout_collection_50_v2/previews/contact_sheet_first_pages.jpg
            out/pdf_layout_collection_50_v2/previews/contact_sheet_inner_pages.jpg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
