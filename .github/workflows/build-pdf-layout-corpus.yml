name: Build Strict PDF Column Corpus

on:
  push:
    branches:
      - pdf-corpus-layout-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Assemble builder
        run: |
          cat tools/pdf_layout_builder.part00 \
              tools/pdf_layout_builder.part01 \
              tools/pdf_layout_builder.part02 \
              tools/pdf_layout_builder.part03 \
              > tools/build_pdf_layout_corpus.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_pdf_layout_corpus.py')
          text = path.read_text()
          override = Path('tools/pdf_layout_builder.part02b').read_text().rstrip() + '\n\n'
          marker = '\ndef accept(c: Candidate, records: list[Record], hashes: set[str]) -> bool:\n'
          if marker not in text:
              raise SystemExit('accept() insertion marker not found')
          text = text.replace(marker, '\n' + override + marker.lstrip('\n'), 1)
          text = text.replace("'metadataPrefix': 'arXivRaw'", "'metadataPrefix': 'arXiv'")
          text = text.replace("local_name(element) == 'arXiv'", "local_name(element) in {'arXiv', 'arXivRaw'}")
          path.write_text(text)
          PY
          python -m py_compile tools/build_pdf_layout_corpus.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF requests beautifulsoup4 Pillow

      - name: Build and verify corpus
        run: |
          python tools/build_pdf_layout_corpus.py
          test "$(find out/pdf_strict_columns_50_v3 -type f -name '*.pdf' | wc -l)" -eq 50
          unzip -t out/pdf_strict_columns_50_v3.zip
          unzip -t out/pdf_strict_columns_source_files_50_v3.zip
          (cd out && sha256sum -c pdf_strict_columns_50_v3.sha256)

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-strict-columns-corpus-v3
          path: |
            out/pdf_strict_columns_50_v3.zip
            out/pdf_strict_columns_source_files_50_v3.zip
            out/pdf_strict_columns_50_v3.sha256
            out/pdf_strict_columns_50_v3/manifest.csv
            out/pdf_strict_columns_50_v3/README_CN.md
            out/pdf_strict_columns_50_v3/previews/contact_sheet_first_pages.jpg
            out/pdf_strict_columns_50_v3/previews/contact_sheet_inner_pages.jpg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
